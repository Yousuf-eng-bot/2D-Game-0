name: Test APK

# Builds an installable APK for on-device testing.
#
# IMPORTANT (see SIGNING.md): the original release keystore is deliberately not
# in this repository, so this workflow uses an explicitly opt-in DISPOSABLE TEST
# signing identity. The resulting APK:
#   * CANNOT update an existing Death World installation signed with the
#     original certificate;
#   * must be installed alongside it on a test device/profile;
#   * must never be published as a release.
# Do NOT uninstall or clear the owner's game data to force this APK on - that
# would destroy save progress.
#
# For a real release, build locally with the original key:
#   SIGNING_KEY=/private/path/ashen-prototype.jks bash tools/build_apk.sh

on:
  # Runs on the Arena working branch so the owner always has a fresh test APK
  # to download from the run's artifacts, and manually from any branch once
  # this workflow reaches the default branch.
  push:
    branches: ["arena/**"]
  workflow_dispatch:
    inputs:
      output_name:
        description: "APK file name"
        required: false
        default: "Death-World-Test.apk"

jobs:
  apk:
    name: Build disposable-test APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        id: paths
        run: |
          set -eux
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          SDKMAN="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1 || true)"
          if [ -z "$SDKMAN" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -sSLo /tmp/cmdline.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKMAN="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMAN" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SDKMAN" --sdk_root="$SDK" \
            "platforms;android-35" "build-tools;34.0.0" "ndk;27.2.12479018"
          NDK="$SDK/ndk/27.2.12479018"
          [ -d "$NDK" ] || NDK="$(find "$SDK/ndk" -maxdepth 1 -mindepth 1 -type d | sort | tail -1)"
          echo "ndk=$NDK" >> "$GITHUB_OUTPUT"
          echo "bt=$SDK/build-tools/34.0.0" >> "$GITHUB_OUTPUT"
          echo "jar=$SDK/platforms/android-35/android.jar" >> "$GITHUB_OUTPUT"

      - name: Build APK with a disposable test key
        env:
          ANDROID_NDK_HOME: ${{ steps.paths.outputs.ndk }}
          ANDROID_BUILD_TOOLS: ${{ steps.paths.outputs.bt }}
          ANDROID_JAR: ${{ steps.paths.outputs.jar }}
          ALLOW_NEW_SIGNING_KEY: "1"
          SIGNING_KEY: ${{ runner.temp }}/disposable-test.jks
          APK_OUTPUT: ${{ github.workspace }}/${{ inputs.output_name || 'Death-World-Test.apk' }}
          # Shown on the game's home screen, so a tester can tell which build
          # is actually installed on the phone.
          DW_BUILD_ID: ${{ github.sha }}
        run: bash tools/build_apk.sh

      - name: Report artifact identity
        run: |
          ls -l "${{ inputs.output_name || 'Death-World-Test.apk' }}"
          sha256sum "${{ inputs.output_name || 'Death-World-Test.apk' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: death-world-test-apk-${{ github.sha }}
          path: ${{ inputs.output_name || 'Death-World-Test.apk' }}
          if-no-files-found: error
          retention-days: 14
